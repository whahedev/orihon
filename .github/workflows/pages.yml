name: GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "examples/bench-compare/**"
      - "examples/showcase/**"
      - "examples/site/**"
      - "examples/navigation/**"
      - "examples/rzd-train-122-tracker/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "scripts/build-browser.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Prepare site
        run: |
          mkdir -p _site/bench _site/rzd _site/osrm
          cp examples/site/index.html _site/index.html
          cp -R examples/bench-compare/. _site/bench/
          cp -R examples/showcase/. _site/showcase/
          cp examples/rzd-train-122-tracker/index.html _site/rzd/index.html
          cp examples/rzd-train-122-tracker/rail-route-cache.json _site/rzd/rail-route-cache.json
          cp examples/navigation/index.html _site/osrm/index.html
          cp examples/navigation/common.css _site/osrm/common.css
          # Showcase + bench + RZD load Orihon from jsDelivr when /dist is absent (no build on Pages).
          # Drop optional local vendor stubs if present.
          rm -rf _site/showcase/vendor _site/bench/vendor
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
