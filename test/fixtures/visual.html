<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Orihon visual contract</title>
    <link rel="stylesheet" href="../../dist/orihon.css" />
    <style>
      html, body, #map { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      #map { background: #edf3f7; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="../../dist/orihon.global.js"></script>
    <script>
      const map = Orihon.createMap("map", {
        center: ({ lat: 52.52, lng: 13.405 }),
        zoom: 10,
        controls: false,
        inertia: false,
        zoomSnap: 0.25
      });
      Orihon.polyline([
        ({ lat: 52.49, lng: 13.35 }), ({ lat: 52.53, lng: 13.41 }), ({ lat: 52.50, lng: 13.440 })
      ], { stroke: "#e11d48", strokeWidth: 5 }).addTo(map);
      Orihon.polygon([[
        ({ lat: 52.51, lng: 13.38 }), ({ lat: 52.54, lng: 13.39 }), ({ lat: 52.535, lng: 13.44 }), ({ lat: 52.505, lng: 13.43 })
      ]], { stroke: "#0f766e", fill: "#14b8a6", fillOpacity: 0.25 }).addTo(map);
      Orihon.circleMarker(({ lat: 52.52, lng: 13.405 }), {
        radiusPixels: 9, stroke: "#172026", fill: "#f59e0b", fillOpacity: 1
      }).addTo(map);
      Orihon.marker(({ lat: 52.53, lng: 13.42 }), { title: "Visual marker" }).addTo(map);
      window.__orihonVisual = { map, ready: true };
    </script>
  </body>
</html>
