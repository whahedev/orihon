<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orihon — ObjectManager speed</title>
    <link rel="stylesheet" href="/dist/orihon.css" />
    <style>
      :root { --ink: #e8eef4; --muted: #93a4b5; --panel: rgba(10, 18, 28, 0.92); --line: rgba(232, 238, 244, 0.12); --accent: #2dd4bf; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; color: var(--ink); font: 14px/1.4 system-ui, sans-serif; background: #071018; }
      #map { position: absolute; inset: 0; }
      .panel {
        position: absolute; z-index: 1000; top: 12px; left: 12px; width: min(380px, calc(100vw - 24px));
        max-height: calc(100vh - 24px); overflow: auto; padding: 14px;
        border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
      }
      h1 { margin: 0; font-size: 1.1rem; }
      .muted { color: var(--muted); margin: 6px 0 10px; font-size: 12px; }
      .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
      button {
        appearance: none; border: 1px solid var(--line); background: #122033; color: var(--ink);
        border-radius: 8px; padding: 7px 10px; font: inherit; cursor: pointer;
      }
      button:hover { border-color: var(--accent); }
      button.active { background: color-mix(in srgb, var(--accent) 22%, #122033); border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .stats {
        margin-top: 10px; padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.04);
        font-family: ui-monospace, Consolas, monospace; font-size: 11px; white-space: pre-wrap;
      }
      /* The live animation line ticks every frame. It had been overwriting the measurements
         above it, so ingest, layout and pan results vanished the moment Animate was running. */
      .stats.live { margin-top: 6px; color: #9fb6c2; }
      .stats.live:empty { display: none; }
    </style>
  </head>
  <body data-state="idle">
    <div id="map"></div>
    <aside class="panel">
      <h1>ObjectManager speed</h1>
      <p class="muted">
        Mass path: <code>sceneFeatures:false</code>, clusters off, packed WebGL.
        Анимируется только подмножество точек — остальной миллион стоит.
        Подложка OSM включена для наглядности; <code>?basemap=0</code> убирает её и сеть из замеров.
      </p>
      <div class="row" id="count-buttons">
        <button type="button" data-count="25000">25k</button>
        <button type="button" data-count="100000">100k</button>
        <button type="button" data-count="250000">250k</button>
        <button type="button" data-count="1000000">1M</button>
      </div>
      <div class="row" id="moving-buttons">
        <button type="button" data-moving="200">move 200</button>
        <button type="button" data-moving="500" class="active">move 500</button>
        <button type="button" data-moving="2000">move 2k</button>
        <button type="button" data-moving="5000">move 5k</button>
      </div>
      <p class="muted" id="moving-hint">Подмножество для Animate: <strong>500</strong> точек</p>
      <div class="row">
        <button type="button" id="run">Load</button>
        <button type="button" id="animate">Animate subset</button>
        <button type="button" id="pan">Pan 8×</button>
        <button type="button" id="stop">Stop</button>
      </div>
      <div class="stats" id="stats">idle</div>
      <div class="stats live" id="live"></div>
    </aside>
    <script type="module">
      import {
        createMap,
        objectManager,
        tileLayer
      } from "/dist/orihon.esm.js";

      const params = new URLSearchParams(location.search);
      let count = Math.max(1000, Number(params.get("count")) || 25_000);
      let moving = Math.max(10, Number(params.get("moving")) || 500);
      const ticksWanted = Math.max(4, Number(params.get("ticks")) || 10);
      const autorun = params.get("autorun") === "1";
      // The automated run turns the basemap off: it measures ObjectManager, and tiles would put
      // the network inside the numbers. A person opening this page wants to see where the points
      // actually are, so it is on by default.
      const basemap = params.get("basemap") !== "0";

      // The extent the points are generated into, and the extent the camera frames. One
      // constant for both, so the benchmark always looks at the data it just created.
      const DATA_SOUTH = 35;
      const DATA_NORTH = 63;
      const DATA_WEST = -15;
      const DATA_EAST = 40;

      const statsEl = document.getElementById("stats");
      const liveEl = document.getElementById("live");
      const map = createMap("map", {
        center: ({ lat: 55.75, lng: 37.62 }),
        zoom: 6,
        controls: true,
        inertia: false
      });

      if (basemap) {
        tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "© OpenStreetMap contributors"
        }).addTo(map);
      }

      const manager = objectManager({
        clusterize: false,
        clusterRenderer: "webgl",
        webglThreshold: 1,
        sceneFeatures: false,
        styleByCategory: false,
        declutter: false,
        visualization: "objects"
      }).addTo(map);

      // Handles for poking at a run from the console or an automated check.
      window.__omDebug = { map, manager };

      let busy = false;
      let animTimer = 0;
      let lastResult = null;

      function heapMb() {
        const mem = performance.memory;
        return mem?.usedJSHeapSize != null ? mem.usedJSHeapSize / (1024 * 1024) : null;
      }

      function yieldToMain() {
        return new Promise((resolve) => setTimeout(resolve, 0));
      }

      function waitFrames(n = 2) {
        return new Promise((resolve) => {
          let left = n;
          const step = () => {
            left -= 1;
            if (left <= 0) resolve();
            else requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        });
      }

      function syncButtons() {
        for (const btn of document.querySelectorAll("#count-buttons button")) {
          btn.classList.toggle("active", Number(btn.dataset.count) === count);
        }
        for (const btn of document.querySelectorAll("#moving-buttons button")) {
          btn.classList.toggle("active", Number(btn.dataset.moving) === moving);
        }
        const hint = document.getElementById("moving-hint");
        if (hint) {
          hint.innerHTML = `Подмножество для Animate: <strong>${moving.toLocaleString("en-US")}</strong> точек`;
        }
      }

      /** Degrees per tick — large enough to see at overview zoom. */
      function animateStepDegrees() {
        const z = map.zoom;
        // ~8–40 CSS px of motion depending on zoom
        return Math.max(0.08, 12 / Math.max(2 ** (z - 2), 1));
      }

      function setStats(text) {
        statsEl.textContent = text;
      }

      /** Per-frame animation state, kept out of the measurement block so neither erases the other. */
      function setLive(text) {
        liveEl.textContent = text;
      }

      function stopAnimate() {
        if (animTimer) {
          clearInterval(animTimer);
          animTimer = 0;
        }
        setLive("");
        document.getElementById("animate").classList.remove("active");
      }

      function report(extra = {}) {
        const s = manager.getStats();
        const heap = heapMb();
        lastResult = {
          objects: s.objects,
          renderer: s.renderer,
          visible: s.visibleObjects,
          count,
          moving: Math.min(moving, s.objects),
          heapMb: heap,
          ...extra
        };
        window.__omSpeed = lastResult;
        const lines = [
          `objects ${s.objects.toLocaleString("en-US")} · renderer ${s.renderer}`,
          extra.ingestMs != null ? `ingest ${extra.ingestMs.toFixed(0)}ms` : null,
          extra.layoutMs != null ? `layout ${extra.layoutMs.toFixed(0)}ms` : null,
          extra.paintMs != null ? `first paint ${extra.paintMs.toFixed(0)}ms${basemap ? " (basemap tiles included)" : ""}` : null,
          extra.animateAvgMs != null
            ? `animate ${extra.moving} · avg ${extra.animateAvgMs.toFixed(1)}ms · max ${extra.animateMaxMs.toFixed(1)}ms`
            : null,
          extra.panAvgMs != null ? `pan ${extra.panAvgMs.toFixed(1)}ms avg` : null,
          extra.fps != null ? `rAF ~${extra.fps.toFixed(0)} fps while animating` : null,
          heap != null ? `heap ${heap.toFixed(0)} MB` : null
        ].filter(Boolean);
        setStats(lines.join("\n"));
        return lastResult;
      }

      async function loadPoints(nextCount = count) {
        if (busy) return lastResult;
        busy = true;
        stopAnimate();
        count = nextCount;
        syncButtons();
        document.body.dataset.state = "running";
        manager.clear();
        const chunk = count >= 1_000_000 ? 50_000 : 20_000;
        const t0 = performance.now();
        let added = 0;
        setStats(`ingest 0 / ${count.toLocaleString("en-US")}`);
        try {
          manager.beginBulk();
          while (added < count) {
            const n = Math.min(chunk, count - added);
            const batch = new Array(n);
            for (let i = 0; i < n; i++) {
              const id = added + i;
              const u = ((id * 2654435761) >>> 0) / 4294967296;
              const v = ((id * 1597334677) >>> 0) / 4294967296;
              batch[i] = {
                id,
                coordinates: ({ lat: DATA_SOUTH + u * (DATA_NORTH - DATA_SOUTH), lng: DATA_WEST + v * (DATA_EAST - DATA_WEST) }),
                properties: { moving: id < moving }
              };
            }
            manager.add(batch);
            added += n;
            if (added % (chunk * 2) === 0 || added === count) {
              setStats(`ingest ${added.toLocaleString("en-US")} / ${count.toLocaleString("en-US")}`);
              await yieldToMain();
            }
          }
          manager.endBulk({ render: false });
          const ingestMs = performance.now() - t0;
          // Frame the generated extent instead of a fixed view over Moscow. The points cover all
          // of Europe, so that camera showed about one percent of them — and five of the five
          // hundred that move, which made a working animation look like a broken one.
          map.fitBounds([
            ({ lat: DATA_SOUTH, lng: DATA_WEST }),
            ({ lat: DATA_NORTH, lng: DATA_EAST })
          ], { padding: 24 });
          const layoutZoom = map.getZoom();
          const l0 = performance.now();
          await manager.prepareLayout(layoutZoom);
          // Layout is the manager's own work. The frames after it belong to the whole page — with
          // a basemap they carry tile decoding too, and folding them into one number made the
          // layout look fifty times slower than it is.
          const layoutMs = performance.now() - l0;
          await waitFrames(3);
          const paintMs = performance.now() - l0;
          const result = report({ ingestMs, layoutMs, paintMs, ticks: 0 });
          document.body.dataset.state = "loaded";
          return result;
        } catch (err) {
          document.body.dataset.state = "failed";
          window.__omSpeed = { error: String(err?.message || err), count, moving };
          setStats(`FAILED\n${String(err?.message || err)}`);
          throw err;
        } finally {
          busy = false;
        }
      }

      async function animateSubset(options = {}) {
        const total = manager.getStats().objects;
        if (total < 10) {
          setStats("load points first");
          return lastResult;
        }
        const n = Math.min(moving, total);
        const duration = 220;
        const samples = [];
        let frames = 0;
        let fpsRaf = 0;
        const fpsLoop = () => {
          frames += 1;
          fpsRaf = requestAnimationFrame(fpsLoop);
        };
        fpsRaf = requestAnimationFrame(fpsLoop);
        const fpsT0 = performance.now();

        const runTick = () => {
          const t0 = performance.now();
          const updates = new Array(n);
          const phase = performance.now() / 400;
          const step = animateStepDegrees();
          for (let i = 0; i < n; i++) {
            const obj = manager.getObject(i);
            if (!obj?.coordinates) continue;
            const heading = (i * 17 + phase * 40) % 360;
            const rad = (heading * Math.PI) / 180;
            updates[i] = {
              id: i,
              coordinates: { lat: obj.coordinates.lat + Math.cos(rad) * step, lng: obj.coordinates.lng + Math.sin(rad) * step },
              properties: obj.properties
            };
          }
          manager.updateObjects(updates.filter(Boolean), { animate: true, durationMs: duration });
          samples.push(performance.now() - t0);
          if (!options.once) {
            setLive(
              `animating ${n.toLocaleString("en-US")} / ${total.toLocaleString("en-US")} · ` +
                `last ${samples[samples.length - 1].toFixed(1)}ms · step ${step.toFixed(3)}°`
            );
          }
        };

        const ticks = Math.max(1, Number(options.ticks) || ticksWanted);
        if (options.once) {
          for (let i = 0; i < ticks; i++) {
            runTick();
            await waitFrames(1);
          }
          cancelAnimationFrame(fpsRaf);
          const elapsed = (performance.now() - fpsT0) / 1000;
          return report({
            ...(lastResult || {}),
            moving: n,
            ticks: samples.length,
            animateAvgMs: samples.reduce((a, b) => a + b, 0) / samples.length,
            animateMaxMs: Math.max(...samples),
            fps: elapsed > 0 ? frames / elapsed : 0
          });
        }

        // The frame counter only feeds the one-shot report; leaving it running would stack a
        // new rAF loop on every press of Animate.
        cancelAnimationFrame(fpsRaf);
        stopAnimate();
        document.getElementById("animate").classList.add("active");
        runTick();
        animTimer = setInterval(runTick, duration);
        return lastResult;
      }

      async function panStress() {
        const samples = [];
        const views = [
          [55.75, 37.62, 6],
          [48.2, 16.4, 7],
          [52.5, 13.4, 6],
          [41.0, 29.0, 5],
          [55.75, 37.62, 8],
          [50.1, 14.4, 6],
          [59.3, 18.1, 6],
          [55.75, 37.62, 6]
        ];
        for (const [lat, lng, zoom] of views) {
          const t0 = performance.now();
          map.setView(({ lat: lat, lng: lng }), zoom);
          await waitFrames(2);
          samples.push(performance.now() - t0);
        }
        return report({
          ...(lastResult || {}),
          panAvgMs: samples.reduce((a, b) => a + b, 0) / samples.length,
          panMaxMs: Math.max(...samples)
        });
      }

      for (const btn of document.querySelectorAll("#count-buttons button")) {
        btn.addEventListener("click", () => {
          count = Number(btn.dataset.count);
          syncButtons();
        });
      }
      for (const btn of document.querySelectorAll("#moving-buttons button")) {
        btn.addEventListener("click", () => {
          moving = Number(btn.dataset.moving);
          syncButtons();
          setLive(`moving subset = ${moving.toLocaleString("en-US")} (нажмите Animate subset)`);
          if (animTimer) {
            stopAnimate();
            void animateSubset({ once: false });
          }
        });
      }
      document.getElementById("run").addEventListener("click", () => {
        void loadPoints(count);
      });
      document.getElementById("animate").addEventListener("click", () => {
        if (animTimer) {
          stopAnimate();
          return;
        }
        void animateSubset({ once: false });
      });
      document.getElementById("pan").addEventListener("click", () => {
        void panStress();
      });
      document.getElementById("stop").addEventListener("click", () => {
        stopAnimate();
      });

      window.__omSpeedRun = async (opts = {}) => {
        if (opts.count) count = Number(opts.count);
        if (opts.moving) moving = Number(opts.moving);
        syncButtons();
        await loadPoints(count);
        const before = { ...manager.getObject(0).coordinates };
        const animated = await animateSubset({ once: true, ticks: opts.ticks || ticksWanted });
        const after = manager.getObject(0).coordinates;
        if (animated) {
          animated.validCoordinates = Number.isFinite(after.lat) && Number.isFinite(after.lng);
          animated.positionChanged = after.lat !== before.lat || after.lng !== before.lng;
        }
        document.body.dataset.state = animated?.error ? "failed" : "passed";
        return animated;
      };

      syncButtons();
      if (autorun) {
        void window.__omSpeedRun({ count, moving, ticks: ticksWanted }).catch((err) => {
          document.body.dataset.state = "failed";
          window.__omSpeed = { error: String(err?.message || err) };
        });
      } else {
        setStats("choose count → Load → Animate subset");
      }
    </script>
  </body>
</html>
